.flip:focus-visible{outline:2px solid var(--g);outline-offset:6px;border-radius:4cqw}
.flip-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;
  transition:transform .75s cubic-bezier(.2,.7,.2,1)}
.flip.is-flipped .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:4cqw;overflow:hidden;
  background:linear-gradient(155deg,#0f5a43,#08281f 62%,#06201a);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  box-shadow:inset 2.4cqw 0 0 var(--red),inset -2.4cqw 0 0 var(--red),0 24px 60px -20px rgba(0,0,0,.65)}
.face.back{transform:rotateY(180deg)}
.face::before{content:"";position:absolute;inset:0;background-size:100% 100%;background-repeat:no-repeat}
.face.front::before{background-image:var(--trace-f)}
.face.back::before{background-image:var(--trace-k)}
.face > *{text-shadow:0 0 1cqw #031a12,0 0 1cqw #031a12,0 0 2.4cqw #031a12}

/* front */
.f-label{position:absolute;left:18%;top:4.4%;font:500 2.3cqw ui-monospace,Menlo,monospace;color:var(--ink);letter-spacing:.14em}
.f-photo{position:absolute;left:18%;top:8.5%;width:64%;aspect-ratio:1/1.12;background:var(--g);
  clip-path:polygon(0 0,88% 0,100% 7%,100% 100%,0 100%)}
.f-photo div{position:absolute;inset:.7cqw;background:#0a1410;overflow:hidden;
  clip-path:polygon(0 0,88% 0,100% 7%,100% 100%,0 100%)}
.f-photo svg{position:absolute;left:10%;bottom:0;width:80%;fill:var(--g);opacity:.92}
.f-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.f-code{position:absolute;left:6%;right:6%;top:64.5%;height:14.5%;border:.45cqw solid var(--g);background:var(--panel)}
.f-bars{position:absolute;left:5%;top:16%;bottom:16%;width:44%;
  background:repeating-linear-gradient(90deg,var(--g) 0 .9cqw,transparent .9cqw 1.6cqw,var(--g) 1.6cqw 3cqw,transparent 3cqw 3.7cqw,var(--g) 3.7cqw 4.3cqw,transparent 4.3cqw 5.2cqw)}
.f-codetxt{position:absolute;left:54%;top:50%;transform:translateY(-50%);font:600 3.2cqw/1.7 ui-monospace,Menlo,monospace;letter-spacing:.06em}
.f-codetxt em{display:block;font-style:normal;color:var(--g)}
.f-rule{position:absolute;left:11%;top:81.2%;width:22%;height:.6cqw;background:var(--red)}
.f-name{position:absolute;left:11%;top:83%;margin:0;font:700 7.2cqw/1 'Space Grotesk',sans-serif;letter-spacing:.1em;color:var(--red)}

/* back */
.b-cta{position:absolute;left:14%;right:14%;top:36%;height:28%;margin:0;border:.6cqw solid var(--g);background:var(--panel);
  display:grid;place-items:center;text-align:center;font:700 11.5cqw/1.12 'Space Grotesk',sans-serif;letter-spacing:.06em;color:var(--g)}
.b-cta::before,.b-cta::after{content:"";position:absolute;width:1.8cqw;height:20%;background:var(--red)}
.b-cta::before{left:-1.2cqw;top:10%}
.b-cta::after{right:-1.2cqw;bottom:10%}

.flip-hint{margin-top:14px;text-align:center;font:500 11px ui-monospace,Menlo,monospace;letter-spacing:.16em;color:#7f8a84}
@media (prefers-reduced-motion:reduce){.flip-inner{transition-duration:.01s}}

.flip{
  --g:#35f2ff;
  --red:#ff3cac;
  --ink:#e9fbff;
  --dim:#8eb8c8;
  --base:#070b18;
  --panel:rgba(5,12,29,.88);
  position:relative;
  filter:drop-shadow(0 0 18px rgba(53,242,255,.16));
}
.flip::before{
  content:"";
  position:absolute;
  inset:-13px;
  z-index:-1;
  border:1px solid rgba(53,242,255,.24);
  background:linear-gradient(135deg,rgba(53,242,255,.08),transparent 35%,rgba(255,60,172,.07));
  clip-path:polygon(0 0,88% 0,100% 12%,100% 100%,12% 100%,0 88%);
  filter:blur(.2px);
}
.face{
  border:1px solid rgba(112,242,255,.7);
  border-radius:2.5cqw;
  background:
    radial-gradient(ellipse at 82% 12%,rgba(255,60,172,.2),transparent 36%),
    radial-gradient(ellipse at 12% 88%,rgba(53,242,255,.17),transparent 42%),
    linear-gradient(145deg,#111b36 0%,#080f22 48%,#050916 100%);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.045),
    inset 0 0 32px rgba(53,242,255,.075),
    0 0 0 1px rgba(255,60,172,.16),
    0 18px 55px -18px rgba(0,0,0,.9),
    0 0 28px rgba(53,242,255,.16);
}
.face::before{
  opacity:.34;
  filter:hue-rotate(115deg) saturate(1.45) brightness(1.35);
  mix-blend-mode:screen;
}
.face::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;
  background:
    linear-gradient(115deg,transparent 18%,rgba(255,255,255,.055) 48%,transparent 66%),
    repeating-linear-gradient(0deg,rgba(155,235,255,.035) 0 1px,transparent 1px 4px);
  opacity:.5;
}
.face > *{z-index:3}
.f-label{
  color:var(--g);
  text-shadow:0 0 7px rgba(53,242,255,.7),0 0 16px rgba(53,242,255,.35);
}
.f-photo{
  background:linear-gradient(135deg,var(--g),var(--red));
  padding:0;
  box-shadow:0 0 0 1px rgba(53,242,255,.7),0 0 22px rgba(53,242,255,.22);
}
.f-photo div{
  background:#080d1d;
}
.f-photo img{
  filter:contrast(1.06) saturate(.9);
}
.f-code{
  border:.45cqw solid rgba(53,242,255,.8);
  background:linear-gradient(100deg,rgba(8,18,40,.96),rgba(15,12,36,.92));
  box-shadow:0 0 16px rgba(53,242,255,.13),inset 0 0 18px rgba(53,242,255,.07);
}
.f-bars{
  background:repeating-linear-gradient(90deg,var(--g) 0 .9cqw,transparent .9cqw 1.6cqw,var(--g) 1.6cqw 3cqw,transparent 3cqw 3.7cqw,var(--g) 3.7cqw 4.3cqw,transparent 4.3cqw 5.2cqw);
  filter:drop-shadow(0 0 4px rgba(53,242,255,.7));
}
.f-codetxt{
  color:#dffaff;
  text-shadow:0 0 8px rgba(53,242,255,.22);
}
.f-codetxt em{
  color:var(--red);
  text-shadow:0 0 9px rgba(255,60,172,.65);
}
.f-rule{
  background:var(--red);
  box-shadow:0 0 9px rgba(255,60,172,.85),0 0 18px rgba(255,60,172,.35);
}
.f-name{
  color:#f4f8ff;
  letter-spacing:.075em;
  text-shadow:0 0 8px rgba(53,242,255,.5),0 0 20px rgba(255,60,172,.2);
}
.b-cta{
  border:.6cqw solid var(--g);
  color:var(--g);
  background:linear-gradient(145deg,rgba(8,18,40,.97),rgba(18,10,37,.94));
  box-shadow:0 0 18px rgba(53,242,255,.2),inset 0 0 22px rgba(53,242,255,.08);
  text-shadow:0 0 10px rgba(53,242,255,.65),0 0 22px rgba(53,242,255,.25);
}
.b-cta::before,.b-cta::after{
  background:var(--red);
  box-shadow:0 0 10px rgba(255,60,172,.8);
}
.flip-hint{
  color:#8daabd;
  text-shadow:0 0 10px rgba(53,242,255,.22);
}
body{
